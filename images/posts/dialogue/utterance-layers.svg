</path></g><g transform="translate(652 334) rotate(0 228 21.69999999999999)"><text x="0" y="30.07060546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#3F7D69" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">02  背景：依赖什么前文</text></g><g transform="translate(652 388) rotate(0 228 39.19999999999999)"><text x="0" y="27.160546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">用户认为曾有承诺</text><text x="0" y="66.360546875" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">需要回看原话与约定</text></g><g stroke-linecap="round" transform="translate(64 512) rotate(0 256 80)"><path d="M0 0 L512 0 L512 160 L0 160" stroke="none" stroke-width="0" fill="#FCF5EA"></path><path d="M0 0 C134.56 0, 269.11 0, 512 0 M0 0 C177.86 0, 355.71 0, 512 0 M512 0 C512 45.22, 512 90.44, 512 160 M512 0 C512 50.17, 512 100.34, 512 160 M512 160 C374.16 160, 236.33 160, 0 160 M512 160 C367 160, 222.01 160, 0 160 M0 160 C0 99.99, 0 39.98, 0 0 M0 160 C0 115.94, 0 71.88, 0 0" stroke="#A16E32" stroke-width="2" fill="none"></path></g><g transform="translate(92 534) rotate(0 228 21.69999999999999)"><text x="0" y="30.07060546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#A16E32" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">03  行动：希望对方做什么</text></g><g transform="translate(92 588) rotate(0 228 39.19999999999999)"><text x="0" y="27.160546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">可能在确认、催促或追责</text><text x="0" y="66.360546875" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">具体诉求还要结合语境</text></g><g stroke-linecap="round" transform="translate(624 512) rotate(0 256 80)"><path d="M0 0 L512 0 L512 160 L0 160" stroke="none" stroke-width="0" fill="#F0F5FB"></path><path d="M0 0 C189.24 0, 378.48 0, 512 0 M0 0 C155.88 0, 311.77 0, 512 0 M512 0 C512 55.66, 512 111.31, 512 160 M512 0 C512 44.52, 512 89.04, 512 160 M512 160 C342.36 160, 172.71 160, 0 160 M512 160 C325.67 160, 139.33 160, 0 160 M0 160 C0 113.22, 0 66.43, 0 0 M0 160 C0 100.85, 0 41.7, 0 0" stroke="#3F6D9A" stroke-width="2" fill="none"></path></g><g transform="translate(652 534) rotate(0 228 21.69999999999999)"><text x="0" y="30.07060546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#3F6D9A" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">04  关系：谁在向谁说</text></g><g transform="translate(652 588) rotate(0 228 39.19999999999999)"><text x="0" y="27.160546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">「你们」可能指向整个机构</text><text x="0" y="66.360546875" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">责任期待可能跨越接待者</text></g><g transform="translate(64 712) rotate(0 536 18.19999999999999)"><text x="536" y="25.2205078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#526277" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同一句话可以兼有多个作用；候选解释需要证据支持。</text></g></svg>