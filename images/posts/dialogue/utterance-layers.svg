<svg role="img" aria-labelledby="diagram-title diagram-desc" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780"><title id="diagram-title">一句话的四个观察角度</title><desc id="diagram-desc">从内容、背景、行动和关系四个角度观察话语，具体解释需要语境与证据。</desc><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1200" height="780" fill="#FFFFFF"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 600 390)"><path d="M0 0 L1200 0 L1200 780 L0 780" stroke="none" stroke-width="0" fill="#FFFFFF"></path><path d="M0 0 C282.72 0, 565.44 0, 1200 0 M0 0 C382.83 0, 765.67 0, 1200 0 M1200 0 C1200 172.96, 1200 345.92, 1200 780 M1200 0 C1200 198.81, 1200 397.63, 1200 780 M1200 780 C935.15 780, 670.3 780, 0 780 M1200 780 C767.7 780, 335.41 780, 0 780 M0 780 C0 541.5, 0 302.99, 0 0 M0 780 C0 547.48, 0 314.95, 0 0" stroke="#FFFFFF" stroke-width="2" fill="none"></path></g><g transform="translate(64 40) rotate(0 536 28)"><text x="0" y="38.80078125" font-family="Helvetica, Segoe UI Emoji" font-size="40px" fill="#172B4D" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">一句话的四个观察角度</text></g><g transform="translate(64 100) rotate(0 536 18.900000000000006)"><text x="0" y="26.19052734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#526277" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">从字面内容出发，结合前文与当前情况，检查它在做什么。</text></g><g stroke-linecap="round"><g transform="translate(64 152) rotate(0 536 0)"><path d="M0 0 C367.06 0, 734.11 0, 1072 0 M0 0 C296 0, 591.99 0, 1072 0" stroke="#D8E1EB" stroke-width="1.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(64 182) rotate(0 536 44)"><path d="M0 0 L1072 0 L1072 88 L0 88" stroke="none" stroke-width="0" fill="#F6F8FA"></path><path d="M0 0 C405.22 0, 810.44 0, 1072 0 M0 0 C423.59 0, 847.19 0, 1072 0 M1072 0 C1072 27.17, 1072 54.33, 1072 88 M1072 0 C1072 24.15, 1072 48.3, 1072 88 M1072 88 C746.6 88, 421.2 88, 0 88 M1072 88 C856.28 88, 640.56 88, 0 88 M0 88 C0 59.06, 0 30.12, 0 0 M0 88 C0 62.43, 0 36.87, 0 0" stroke="#D8E1EB" stroke-width="2" fill="none"></path></g><g transform="translate(90 204) rotate(0 510 23.099999999999994)"><text x="510" y="32.01064