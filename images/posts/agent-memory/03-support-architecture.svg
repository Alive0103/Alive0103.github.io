<title id="title">客服记忆如何接入业务系统</title>
<desc id="desc">全渠道接入后先完成身份和问题定位，再读取记忆、查询业务事实与适用规则；组装证据上下文后响应或调用业务工具，回执与交互事件推动工单和后台记忆更新。</desc>
