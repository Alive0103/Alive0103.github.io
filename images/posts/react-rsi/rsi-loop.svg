<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">RSI：跨代际的自我改进循环</title>
<desc id="desc">Agent 执行任务，由基准或环境验证表现，验证通过的修改写入自身，下一代 Agent 继承改动继续循环。与 ReAct 的单次任务循环形成对照。</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#677A90"/></marker></defs>
<rect width="720" height="640" fill="#FFFFFF"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#172B4D">
<text x="48" y="62" font-size="26" font-weight="600" text-anchor="start" fill="#172B4D">RSI：跨代际的自我改进循环</text>
<text x="48" y="96" font-size="17" font-weight="400" text-anchor="start" fill="#526277">改动经过验证后保留，由下一代 Agent 继承。</text>
<path d="M 48 114 L 672 114" fill="none" stroke="#DEE4EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80" y="170" width="220" height="92" rx="8" fill="#F0F5FC" stroke="#5A7FAD" stroke-width="2"/>
<text x="190" y="207" font-size="19" font-weight="600" text-anchor="middle" fill="#2F5D92">执行任务（Agent vₙ）</text>
<text x="190" y="236" font-size="14" font-weight="400" text-anchor="middle" fill="#526277">在基准任务上运行</text>
<rect x="420" y="170" width="220" height="92" rx="8" fill="#EFF7F3" stroke="#5B927A" stroke-width="2"/>
<text x="530" y="207" font-size="19" font-weight="600" text-anchor="middle" fill="#326A54">评估 / 验证</text>
<text x="530" y="236" font-size="14" font-weight="400" text-anchor="middle" fill="#526277">只有变好的改动被保留</text>
<rect x="420" y="382" width="220" height="92" rx="8" fill="#FFF5EA" stroke="#C99657" stroke-width="2"/>
<text x="530" y="419" font-size="19" font-weight="600" text-anchor="middle" fill="#976020">修改自身</text>
<text x="530" y="448" font-size="14" font-weight="400" text-anchor="middle" fill="#526277">代码 / 提示词 / 自身结构</text>
<rect x="80" y="382" width="220" height="92" rx="8" fill="#F0F5FC" stroke="#5A7FAD" stroke-width="2"/>
<text x="190" y="419" font-size="19" font-weight="600" text-anchor="middle" fill="#2F5D92">Agent vₙ₊₁</text>
<text x="190" y="448" font-size="14" font-weight="400" text-anchor="middle" fill="#526277">继承验证过的改动</text>
<path d="M 300 216 L 418 216" fill="none" stroke="#677A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<path d="M 530 262 L 530 380" fill="none" stroke="#677A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<path d="M 420 428 L 302 428" fill="none" stroke="#677A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<path d="M 190 382 L 190 264" fill="none" stroke="#677A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow2)"/>
<text x="360" y="310" font-size="15" font-weight="600" text-anchor="middle" fill="#172B4D">每一代的能力</text>
<text x="360" y="334" font-size="15" font-weight="600" text-anchor="middle" fill="#172B4D">来自上一代验证过的改动</text>
<text x="360" y="366" font-size="13" font-weight="400" text-anchor="middle" fill="#526277">未通过验证的修改被丢弃</text>
<rect x="60" y="520" width="600" height="62" rx="8" fill="#FFFFFF" stroke="#B0BCCB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="84" y="545" font-size="15" font-weight="600" text-anchor="start" fill="#172B4D">与 ReAct 对照</text>
<text x="84" y="568" font-size="14" font-weight="400" text-anchor="start" fill="#526277">改进不留在上下文里，而留在 Agent 自身；循环跨越任务与代际，而不是一次任务。</text>
</g>
</svg>
