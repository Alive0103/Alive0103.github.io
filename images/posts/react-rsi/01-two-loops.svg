<text x="559.0" y="335.05" font-size="21" text-anchor="middle" fill="#52657a" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">调用工具、查询环境</text>
<rect x="792" y="258" width="238" height="104" fill="#eef8f2" stroke="#33795f" stroke-width="2"/>
