<text x="207.0" y="335.05" font-size="21" text-anchor="middle" fill="#52657a" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">理解目标与当前证据</text>
<rect x="440" y="258" width="238" height="104" fill="#fff6ea" stroke="#9a652e" stroke-width="2"/>
