<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc">
<title id="title">ReAct 推进任务，RSI 改进执行系统</title><desc id="desc">上方是任务中的决策、行动、观察循环。下方从当前版本出发生成候选，运行后评价并继承。新版本是否也能增强改进者，需要单独验证。</desc>
<rect x="0" y="0" width="1120" height="1110" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="48" y="46.900000000000006" font-size="18" text-anchor="start" fill="#315f9c" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">REACT &amp; RSI  /  01</text>
<text x="48" y="101.80000000000001" font-size="36" text-anchor="start" fill="#172b45" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">一个循环推进任务，另一个循环改进系统</text>
<text x="48" y="142.15" font-size="23" text-anchor="start" fill="#52657a" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">两种循环可以嵌套；它们改变的对象和需要的证据不同。</text>
<rect x="48" y="174" width="1024" height="330" fill="#f8fafd" stroke="#d4deeb" stroke-width="2"/>
<text x="72" y="219.4" font-size="28" text-anchor="start" fill="#315f9c" font-family="Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">任务执行：ReAct</text>
