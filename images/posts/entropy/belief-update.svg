<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc">
<title id="title">新证据，有时会让熵增加</title>
<desc id="desc">先验正常0.99异常0.01，观察到异常信号后后验为0.5和0.5。熵上升约0.919 bit，后验对先验的KL约2.329 bit，二者单次不相等。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="805" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  07</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">新证据，有时会让熵增加</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">同一状态空间上的贝叶斯更新；先验与似然假设见正文。</text>
<rect x="54" y="191" width="464" height="298" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="286" y="233" font-size="27" fill="#466f91" font-weight="600" text-anchor="middle">观察前：几乎确信正常</text><text x="79" y="312" font-size="24" fill="#263747" font-weight="400" text-anchor="start">正常</text><rect x="155" y="283" width="295" height="34" rx="2" fill="#f0f2f2" stroke="#f0f2f2" stroke-width="2"/><rect x="155" y="283" width="292.05" height="34" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="462" y="310" font-size="23" fill="#466f91" font-weight="600" text-anchor="start">99%</text><text x="79" y="378" font-size="24" fill="#263747" font-weight="400" text-anchor="start">异常</text><rect x="155" y="349" width="295" height="34" rx="2" fill="#f0f2f2" stroke="#f0f2f2" stroke-width="2"/><rect x="155" y="349" width="2.95" height="34" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="462" y="376" font-size="23" fill="#466f91" font-weight="600" text-anchor="start">1%</text><text x="286" y="449" font-size="29" fill="#466f91" font-weight="600" text-anchor="middle">H = 0.081 bit</text><rect x="682" y="191" width="464" height="298" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="914" y="233" font-size="27" fill="#aa7642" font-weight="600" text-anchor="middle">观察后：需要进一步核查</text><text x="707" y="312" font-size="24" fill="#263747" font-weight="400" text-anchor="start">正常</text><rect x="783" y="283" width="295" height="34" rx="2" fill="#f0f2f2" stroke="#f0f2f2" stroke-width="2"/><rect x="783" y="283" width="147.5" height="34" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="1090" y="310" font-size="23" fill="#aa7642" font-weight="600" text-anchor="start">50%</text><text x="707" y="378" font-size="24" fill="#263747" font-weight="400" text-anchor="start">异常</text><rect x="783" y="349" width="295" height="34" rx="2" fill="#f0f2f2" stroke="#f0f2f2" stroke-width="2"/><rect x="783" y="349" width="147.5" height="34" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="1090" y="376" font-size="23" fill="#aa7642" font-weight="600" text-anchor="start">50%</text><text x="914" y="449" font-size="29" fill="#aa7642" font-weight="600" text-anchor="middle">H = 1.000 bit</text><path d="M532 338 H666" fill="none" stroke="#aa7642" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/><text x="600" y="282" font-size="23" fill="#aa7642" font-weight="500" text-anchor="middle">异常信号</text><rect x="54" y="530" width="1092" height="112" rx="10" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="600" y="574" font-size="27" fill="#263747" font-weight="600" text-anchor="middle">熵差 ΔH ≈ −0.919 bit     后验相对先验的 KL ≈ 2.329 bit</text><text x="600" y="618" font-size="26" fill="#aa7642" font-weight="500" text-anchor="middle">这一次更不确定，但对原有判断作出了重要修正。</text><text x="600" y="687" font-size="25" fill="#66747c" font-weight="400" text-anchor="middle">只有在一致模型中对所有观察求期望，才与互信息相等。</text>
<path d="M52 735 L1148 735" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="775" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">判断信息是否有用，不能要求每次观察之后都更确定。</text>
</g>
</svg>
