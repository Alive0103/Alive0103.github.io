<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="722" viewBox="0 0 1200 722" role="img" aria-labelledby="title desc">
<title id="title">交叉熵 = 熵 + KL 散度</title>
<desc id="desc">二类等概率真实分布的熵为1 bit。预测概率为0.9和0.1时，KL为0.737 bit，交叉熵为1.737 bit。条形长度按精确计算值绘制。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="722" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  05</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">交叉熵 = 熵 + KL 散度</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">让真实结果按 P 出现，再用 Q 为这些结果分配概率。</text>
<rect x="54" y="193" width="522" height="107" rx="10" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><text x="315" y="234" font-size="28" fill="#466f91" font-weight="600" text-anchor="middle">实际分布 P = (0.5, 0.5)</text><text x="315" y="276" font-size="24" fill="#66747c" font-weight="400" text-anchor="middle">两种结果同样常见</text><rect x="624" y="193" width="522" height="107" rx="10" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="885" y="234" font-size="28" fill="#aa7642" font-weight="600" text-anchor="middle">预测分布 Q = (0.9, 0.1)</text><text x="885" y="276" font-size="24" fill="#66747c" font-weight="400" text-anchor="middle">模型过度偏向第一种结果</text><text x="104" y="356" font-size="21" fill="#66747c" font-weight="400" text-anchor="start">条形长度与信息量成正比（单位：bit）</text><rect x="104" y="381" width="520" height="99" rx="0" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><rect x="624" y="381" width="383.222" height="99" rx="0" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="364" y="422" font-size="30" fill="#466f91" font-weight="600" text-anchor="middle">H(P)</text><text x="364" y="460" font-size="27" fill="#466f91" font-weight="500" text-anchor="middle">1.000 bit</text><text x="815" y="422" font-size="30" fill="#aa7642" font-weight="600" text-anchor="middle">KL(P ‖ Q)</text><text x="815" y="460" font-size="27" fill="#aa7642" font-weight="500" text-anchor="middle">0.737 bit</text><path d="M104 504 L1007.222 504" fill="none" stroke="#263747" stroke-width="2" stroke-dasharray=""/><path d="M104 492 L104 512" fill="none" stroke="#263747" stroke-width="2" stroke-dasharray=""/><path d="M1007.222 492 L1007.222 512" fill="none" stroke="#263747" stroke-width="2" stroke-dasharray=""/><text x="555" y="554" font-size="32" fill="#263747" font-weight="600" text-anchor="middle">H(P, Q) = 1.737 bit</text><text x="600" y="607" font-size="26" fill="#66747c" font-weight="400" text-anchor="middle">实际分布自身的不确定性  +  预测不匹配带来的额外代价</text>
<path d="M52 652 L1148 652" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="692" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">预测越偏离实际分布，平均负对数概率的额外代价越大。</text>
</g>
</svg>
