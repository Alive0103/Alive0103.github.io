<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="857" viewBox="0 0 1200 857" role="img" aria-labelledby="title desc">
<title id="title">一个追问，能排除多少未知？</title>
<desc id="desc">四种退款问题等概率，初始熵2 bit。未发起答案概率四分之一、剩余熵零；已发起概率四分之三、剩余熵log2 3。期望减少0.811 bit。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="857" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  04</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">一个追问，能排除多少未知？</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">教学假设：状态分支完备，用户能准确回答，当前尚无相关记录。</text>
<rect x="350" y="190" width="500" height="96" rx="10" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><text x="600" y="228" font-size="27" fill="#263747" font-weight="600" text-anchor="middle">四种可能：A / B / C / D</text><text x="600" y="266" font-size="25" fill="#466f91" font-weight="400" text-anchor="middle">各占 1/4，H(Z) = 2 bit</text><path d="M600 286 V327" fill="none" stroke="#466f91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="350" y="334" width="500" height="74" rx="10" fill="white" stroke="#466f91" stroke-width="2"/><text x="600" y="382" font-size="29" fill="#263747" font-weight="600" text-anchor="middle">追问：退款已经发起了吗？</text><path d="M460 408 V453 H301 V502" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><path d="M740 408 V453 H899 V502" fill="none" stroke="#aa7642" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/><text x="301" y="443" font-size="24" fill="#4e7c68" font-weight="500" text-anchor="middle">没有：概率 1/4</text><text x="899" y="443" font-size="24" fill="#aa7642" font-weight="500" text-anchor="middle">已发起：概率 3/4</text><rect x="54" y="510" width="494" height="125" rx="10" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><text x="301" y="554" font-size="26" fill="#4e7c68" font-weight="600" text-anchor="middle">确定为 A：退款尚未发起</text><text x="301" y="603" font-size="27" fill="#263747" font-weight="400" text-anchor="middle">剩余熵 = 0 bit</text><rect x="652" y="510" width="494" height="125" rx="10" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="899" y="554" font-size="25" fill="#aa7642" font-weight="600" text-anchor="middle">剩下 B / C / D，条件下等概率</text><text x="899" y="603" font-size="25" fill="#263747" font-weight="400" text-anchor="middle">剩余熵 = log₂ 3 ≈ 1.585 bit</text><text x="600" y="695" font-size="27" fill="#263747" font-weight="500" text-anchor="middle">平均剩余：1/4 × 0 + 3/4 × 1.585 ≈ 1.189 bit</text><text x="600" y="742" font-size="29" fill="#466f91" font-weight="600" text-anchor="middle">预期收益：2 − 1.189 ≈ 0.811 bit</text>
<path d="M52 787 L1148 787" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="827" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">收益按所有可能回答加权；是否值得问，还要考虑成本。</text>
</g>
</svg>
