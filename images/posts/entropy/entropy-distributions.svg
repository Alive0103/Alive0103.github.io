<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="717" viewBox="0 0 1200 717" role="img" aria-labelledby="title desc">
<title id="title">分布越集中，熵越低</title>
<desc id="desc">四种状态等概率时熵为2 bit；概率0.7、0.1、0.1、0.1时熵约1.357 bit；概率1、0、0、0时熵为0。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="717" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  02</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">分布越集中，熵越低</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">同一组四种状态；纵轴为概率，三个面板使用相同刻度。</text>
<text x="54" y="191" font-size="23" fill="#66747c" font-weight="400" text-anchor="start">示例状态：A 审核中   B 渠道处理中   C 已到账   D 失败</text><rect x="54" y="220" width="332" height="387" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="220" y="264" font-size="26" fill="#466f91" font-weight="600" text-anchor="middle">四种状态等概率</text><text x="98" y="313" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">100%</text><path d="M108 306 L360 306" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="98" y="403" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">50%</text><path d="M108 396 L360 396" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="98" y="493" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">0</text><path d="M108 486 L360 486" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><rect x="121" y="441.0" width="34" height="45.0" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="138" y="429.0" font-size="19" fill="#466f91" font-weight="500" text-anchor="middle">25%</text><text x="138" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">A</text><rect x="182" y="441.0" width="34" height="45.0" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="199" y="429.0" font-size="19" fill="#466f91" font-weight="500" text-anchor="middle">25%</text><text x="199" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">B</text><rect x="243" y="441.0" width="34" height="45.0" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="260" y="429.0" font-size="19" fill="#466f91" font-weight="500" text-anchor="middle">25%</text><text x="260" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">C</text><rect x="304" y="441.0" width="34" height="45.0" rx="2" fill="#466f91" stroke="#466f91" stroke-width="2"/><text x="321" y="429.0" font-size="19" fill="#466f91" font-weight="500" text-anchor="middle">25%</text><text x="321" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">D</text><text x="220" y="573" font-size="27" fill="#466f91" font-weight="600" text-anchor="middle">H = 2.000 bit</text><rect x="434" y="220" width="332" height="387" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="600" y="264" font-size="26" fill="#aa7642" font-weight="600" text-anchor="middle">倾向于一种状态</text><text x="478" y="313" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">100%</text><path d="M488 306 L740 306" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="478" y="403" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">50%</text><path d="M488 396 L740 396" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="478" y="493" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">0</text><path d="M488 486 L740 486" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><rect x="501" y="360.0" width="34" height="125.99999999999999" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="518" y="348.0" font-size="19" fill="#aa7642" font-weight="500" text-anchor="middle">70%</text><text x="518" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">A</text><rect x="562" y="468.0" width="34" height="18.0" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="579" y="456.0" font-size="19" fill="#aa7642" font-weight="500" text-anchor="middle">10%</text><text x="579" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">B</text><rect x="623" y="468.0" width="34" height="18.0" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="640" y="456.0" font-size="19" fill="#aa7642" font-weight="500" text-anchor="middle">10%</text><text x="640" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">C</text><rect x="684" y="468.0" width="34" height="18.0" rx="2" fill="#aa7642" stroke="#aa7642" stroke-width="2"/><text x="701" y="456.0" font-size="19" fill="#aa7642" font-weight="500" text-anchor="middle">10%</text><text x="701" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">D</text><text x="600" y="573" font-size="27" fill="#aa7642" font-weight="600" text-anchor="middle">H = 1.357 bit</text><rect x="814" y="220" width="332" height="387" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="980" y="264" font-size="26" fill="#4e7c68" font-weight="600" text-anchor="middle">一种状态已确定</text><text x="858" y="313" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">100%</text><path d="M868 306 L1120 306" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="858" y="403" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">50%</text><path d="M868 396 L1120 396" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><text x="858" y="493" font-size="17" fill="#66747c" font-weight="400" text-anchor="end">0</text><path d="M868 486 L1120 486" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/><rect x="881" y="306" width="34" height="180" rx="2" fill="#4e7c68" stroke="#4e7c68" stroke-width="2"/><text x="898" y="294" font-size="19" fill="#4e7c68" font-weight="500" text-anchor="middle">100%</text><text x="898" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">A</text><text x="959" y="474" font-size="19" fill="#4e7c68" font-weight="500" text-anchor="middle">0%</text><text x="959" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">B</text><text x="1020" y="474" font-size="19" fill="#4e7c68" font-weight="500" text-anchor="middle">0%</text><text x="1020" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">C</text><text x="1081" y="474" font-size="19" fill="#4e7c68" font-weight="500" text-anchor="middle">0%</text><text x="1081" y="522" font-size="22" fill="#263747" font-weight="500" text-anchor="middle">D</text><text x="980" y="573" font-size="27" fill="#4e7c68" font-weight="600" text-anchor="middle">H = 0.000 bit</text>
<path d="M52 647 L1148 647" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="687" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">熵描述分布的不确定性；分布是否正确，要用事实验证。</text>
