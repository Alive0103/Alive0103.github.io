<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="853" viewBox="0 0 1200 853" role="img" aria-labelledby="title desc">
<title id="title">先合并等价表达，再观察结论分歧</title>
<desc id="desc">四条示例回答中三条表达仍在处理中，一条表达已到账。归成两组后按采样频率估计熵约0.811 bit；该频率不是真实业务状态的概率。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="853" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  06</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">先合并等价表达，再观察结论分歧</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">四次采样仅用于解释计算；实际估计需要足够样本与可靠分组。</text>
<text x="75" y="205" font-size="24" fill="#66747c" font-weight="500" text-anchor="start">同一问题、上下文和证据</text><text x="803" y="205" font-size="24" fill="#66747c" font-weight="500" text-anchor="start">按含义等价分组</text><rect x="65" y="231" width="518" height="66" rx="10" fill="white" stroke="#4e7c68" stroke-width="2"/><text x="90" y="274" font-size="27" fill="#263747" font-weight="400" text-anchor="start">退款仍在处理中。</text><path d="M583 264 H634 V358 H722" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="65" y="325" width="518" height="66" rx="10" fill="white" stroke="#4e7c68" stroke-width="2"/><text x="90" y="368" font-size="27" fill="#263747" font-weight="400" text-anchor="start">这笔退款正在处理中。</text><path d="M583 358 H634 V358 H722" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="65" y="419" width="518" height="66" rx="10" fill="white" stroke="#4e7c68" stroke-width="2"/><text x="90" y="462" font-size="27" fill="#263747" font-weight="400" text-anchor="start">目前还处于退款处理阶段。</text><path d="M583 452 H634 V358 H722" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="65" y="564" width="518" height="66" rx="10" fill="white" stroke="#aa7642" stroke-width="2"/><text x="90" y="607" font-size="27" fill="#263747" font-weight="400" text-anchor="start">这笔退款已到账。</text><path d="M583 597 H634 V607 H722" fill="none" stroke="#aa7642" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="735" y="276" width="406" height="164" rx="10" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><text x="938" y="324" font-size="29" fill="#4e7c68" font-weight="600" text-anchor="middle">语义组 A：处理中</text><text x="938" y="371" font-size="30" fill="#263747" font-weight="600" text-anchor="middle">3 / 4 次</text><text x="938" y="410" font-size="24" fill="#66747c" font-weight="400" text-anchor="middle">措辞不同，结论相同</text><rect x="735" y="529" width="406" height="155" rx="10" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="938" y="576" font-size="29" fill="#aa7642" font-weight="600" text-anchor="middle">语义组 B：已到账</text><text x="938" y="625" font-size="30" fill="#263747" font-weight="600" text-anchor="middle">1 / 4 次</text><text x="938" y="662" font-size="24" fill="#66747c" font-weight="400" text-anchor="middle">与 A 的状态判断不同</text><text x="600" y="738" font-size="28" fill="#263747" font-weight="500" text-anchor="middle">按示例采样频率估计：Hsem ≈ 0.811 bit</text>
<path d="M52 783 L1148 783" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="823" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">稳定一致也可能稳定出错；低语义熵不能证明事实正确。</text>
</g>
</svg>
