<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="711" viewBox="0 0 1200 711" role="img" aria-labelledby="title desc">
<title id="title">共同的信息，只计算一次</title>
<desc id="desc">联合熵由X在已知Y后剩余的条件熵、互信息和Y在已知X后剩余的条件熵组成。X的熵等于左侧和中间，Y的熵等于中间和右侧。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="711" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  03</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">共同的信息，只计算一次</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">经典离散随机变量的关系示意；区域面积不代表实际数值。</text>
<rect x="86" y="198" width="1028" height="345" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="600" y="236" font-size="25" fill="#66747c" font-weight="500" text-anchor="middle">联合熵 H(X, Y)：两者合起来的不确定性</text><rect x="133" y="281" width="934" height="184" rx="0" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><rect x="133" y="281" width="625" height="184" rx="0" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><rect x="442" y="281" width="316" height="184" rx="0" fill="#dceae7" stroke="#4e7c68" stroke-width="2"/><text x="286" y="348" font-size="31" fill="#466f91" font-weight="600" text-anchor="middle">H(X | Y)</text><text x="286" y="393" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">知道 Y 后</text><text x="286" y="428" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">X 仍未知的部分</text><text x="600" y="348" font-size="31" fill="#4e7c68" font-weight="600" text-anchor="middle">I(X; Y)</text><text x="600" y="393" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">相互提供的</text><text x="600" y="428" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">信息</text><text x="912" y="348" font-size="31" fill="#4e7c68" font-weight="600" text-anchor="middle">H(Y | X)</text><text x="912" y="393" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">知道 X 后</text><text x="912" y="428" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">Y 仍未知的部分</text><path d="M133 264 L758 264" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><text x="286" y="264" font-size="24" fill="#263747" font-weight="400" text-anchor="start"></text><text x="345" y="507" font-size="26" fill="#466f91" font-weight="500" text-anchor="middle">H(X) = 左侧 + 中间</text><text x="856" y="507" font-size="26" fill="#4e7c68" font-weight="500" text-anchor="middle">H(Y) = 中间 + 右侧</text><text x="600" y="597" font-size="29" fill="#263747" font-weight="500" text-anchor="middle">H(X, Y) = H(X | Y) + I(X; Y) + H(Y | X)</text>
<path d="M52 641 L1148 641" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="681" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">独立时，中间的互信息为零；有关联时，不能简单相加。</text>
</g>
</svg>
