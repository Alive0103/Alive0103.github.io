<title id="title">自我改进系统：从执行证据到可继承的版本</title><desc id="desc">固定实验条件下，改进器读取版本和经验，生成候选。候选运行后接受筛选，结果进入档案供下一轮使用。冻结候选在未参与选择的新任务上检查泛化。</desc>
