<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1009" viewBox="0 0 1200 1009" role="img" aria-labelledby="title desc">
<title id="title">会话质量，需要一条可复核的证据链</title>
<desc id="desc">完整会话、当时规则、工具记录与后续状态构成证据，通过规则核对、模型评价和人工复核形成分维度结论，再结合实际业务结果校准评价标准。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="1009" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  08</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">会话质量，需要一条可复核的证据链</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">先确认任务与事实，再判断表达、行动和整段会话的结果。</text>
<rect x="54" y="190" width="249" height="98" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="178.5" y="230" font-size="28" fill="#263747" font-weight="600" text-anchor="middle">完整会话</text><text x="178.5" y="267" font-size="21" fill="#66747c" font-weight="400" text-anchor="middle">目标 · 历史 · 回复</text><path d="M178.5 288 L178.5 321" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><rect x="335" y="190" width="249" height="98" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="459.5" y="230" font-size="28" fill="#263747" font-weight="600" text-anchor="middle">当时规则</text><text x="459.5" y="267" font-size="21" fill="#66747c" font-weight="400" text-anchor="middle">版本 · 适用条件</text><path d="M459.5 288 L459.5 321" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><rect x="616" y="190" width="249" height="98" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="740.5" y="230" font-size="28" fill="#263747" font-weight="600" text-anchor="middle">工具记录</text><text x="740.5" y="267" font-size="21" fill="#66747c" font-weight="400" text-anchor="middle">请求 · 结果 · 时间</text><path d="M740.5 288 L740.5 321" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><rect x="897" y="190" width="249" height="98" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="1021.5" y="230" font-size="28" fill="#263747" font-weight="600" text-anchor="middle">后续状态</text><text x="1021.5" y="267" font-size="21" fill="#66747c" font-weight="400" text-anchor="middle">执行 · 承诺 · 反馈</text><path d="M1021.5 288 L1021.5 321" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><path d="M178.5 321 L1021.5 321" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><path d="M600 321 V350" fill="none" stroke="#466f91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="290" y="358" width="620" height="69" rx="10" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><text x="600" y="403" font-size="29" fill="#466f91" font-weight="600" text-anchor="middle">按任务关联证据，并对齐发生时间</text><path d="M600 427 L600 462" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><path d="M224 462 L976 462" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><path d="M224 462 V493" fill="none" stroke="#466f91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="54" y="503" width="340" height="155" rx="10" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><text x="224" y="546" font-size="29" fill="#466f91" font-weight="600" text-anchor="middle">规则核对</text><text x="224" y="590" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">检查明确条件</text><text x="224" y="625" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">与执行结果</text><path d="M224 658 L224 692" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><path d="M600 462 V493" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="430" y="503" width="340" height="155" rx="10" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><text x="600" y="546" font-size="29" fill="#4e7c68" font-weight="600" text-anchor="middle">模型评价</text><text x="600" y="590" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">判断语义质量</text><text x="600" y="625" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">给出证据与理由</text><path d="M600 658 L600 692" fill="none" stroke="#4e7c68" stroke-width="2" stroke-dasharray=""/><path d="M976 462 V493" fill="none" stroke="#aa7642" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="806" y="503" width="340" height="155" rx="10" fill="#f8f0e5" stroke="#aa7642" stroke-width="2"/><text x="976" y="546" font-size="29" fill="#aa7642" font-weight="600" text-anchor="middle">人工复核</text><text x="976" y="590" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">审查分歧与错误</text><text x="976" y="625" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">校准评价标准</text><path d="M976 658 L976 692" fill="none" stroke="#aa7642" stroke-width="2" stroke-dasharray=""/><path d="M224 692 L976 692" fill="none" stroke="#4e7c68" stroke-width="2" stroke-dasharray=""/><path d="M600 692 V725" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="158" y="733" width="884" height="81" rx="10" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><text x="600" y="768" font-size="28" fill="#4e7c68" font-weight="600" text-anchor="middle">分维度结论 + 严重错误 + 证据不足 + 待兑现承诺</text><text x="600" y="802" font-size="22" fill="#66747c" font-weight="400" text-anchor="middle">区分本轮进展与最终解决</text><path d="M600 814 V853" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><text x="600" y="890" font-size="27" fill="#263747" font-weight="500" text-anchor="middle">用实际解决、再次咨询和承诺履行情况检验评价标准</text>
<path d="M52 939 L1148 939" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="979" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">熵与散度辅助诊断；最终质量由任务、证据和结果共同判断。</text>
</g>
</svg>
