<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img" aria-labelledby="title desc">
<title id="title">一句话，两个不同的测量问题</title>
<desc id="desc">同一句退款已到账，可以通过语言模型计算意外程度，也可以结合任务目标与真实证据判断其帮助。两者的输入和结论不同。</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#466f91" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4e7c68" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa7642" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66747c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="785" rx="16" fill="#fcfaf6"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<text x="52" y="44" font-size="17" fill="#66747c" font-weight="500" text-anchor="start">INFORMATION THEORY  /  01</text>
<text x="52" y="99" font-size="38" fill="#263747" font-weight="600" text-anchor="start">一句话，两个不同的测量问题</text>
<text x="52" y="144" font-size="24" fill="#66747c" font-weight="400" text-anchor="start">先确定测量对象，再讨论“信息量”的高低。</text>
<rect x="380" y="180" width="440" height="92" rx="10" fill="white" stroke="#ccd4d6" stroke-width="2"/><text x="600" y="216" font-size="22" fill="#66747c" font-weight="400" text-anchor="middle">同一句回复</text><text x="600" y="251" font-size="29" fill="#263747" font-weight="600" text-anchor="middle">“退款已到账”</text><path d="M490 272 V307 H314 V340" fill="none" stroke="#466f91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M710 272 V307 H886 V340" fill="none" stroke="#4e7c68" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/><rect x="54" y="345" width="520" height="276" rx="10" fill="#edf3f7" stroke="#466f91" stroke-width="2"/><text x="314" y="392" font-size="30" fill="#466f91" font-weight="600" text-anchor="middle">语言的可预测性</text><text x="314" y="438" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">这句话在模型看来有多意外？</text><path d="M82 461 L546 461" fill="none" stroke="#466f91" stroke-width="2" stroke-dasharray=""/><text x="82" y="503" font-size="24" fill="#263747" font-weight="400" text-anchor="start">输入：模型、上下文、词元概率</text><text x="82" y="543" font-size="24" fill="#263747" font-weight="400" text-anchor="start">计算：负对数概率、词元熵</text><text x="82" y="583" font-size="24" fill="#263747" font-weight="400" text-anchor="start">得到：语言层面的惊讶程度</text><rect x="626" y="345" width="520" height="276" rx="10" fill="#edf4ef" stroke="#4e7c68" stroke-width="2"/><text x="886" y="392" font-size="30" fill="#4e7c68" font-weight="600" text-anchor="middle">任务中的有效进展</text><text x="886" y="438" font-size="24" fill="#263747" font-weight="400" text-anchor="middle">它是否帮助用户理解并解决问题？</text><path d="M654 461 L1118 461" fill="none" stroke="#4e7c68" stroke-width="2" stroke-dasharray=""/><text x="654" y="503" font-size="24" fill="#263747" font-weight="400" text-anchor="start">输入：用户目标、已知事实、证据</text><text x="654" y="543" font-size="24" fill="#263747" font-weight="400" text-anchor="start">观察：状态澄清、动作、处理结果</text><text x="654" y="583" font-size="24" fill="#263747" font-weight="400" text-anchor="start">得到：有依据的任务进展</text><text x="600" y="673" font-size="25" fill="#66747c" font-weight="400" text-anchor="middle">两条路径可以互相补充，但不能把一个分数当成另一个。</text>
<path d="M52 715 L1148 715" fill="none" stroke="#ccd4d6" stroke-width="2" stroke-dasharray=""/>
<text x="600" y="755" font-size="24" fill="#263747" font-weight="500" text-anchor="middle">语言上的罕见，并不自动意味着对当前任务有帮助。</text>
</g>
</svg>
