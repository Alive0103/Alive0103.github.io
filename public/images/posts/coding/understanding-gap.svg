<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">产出扩大时，理解也需要增长</title>
<desc id="desc">借助 AI 能完成的范围中，已有理解支撑个人判断；必须负责却尚未弄懂的机制形成理解债务。其余实现细节仍可通过接口、抽象与协作管理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#677A90"/></marker></defs>
<rect width="1200" height="780" fill="#FFFFFF"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#172B4D">
<text x="64" y="83" font-size="42" font-weight="600" text-anchor="start" fill="#172B4D">产出扩大时，理解也需要增长</text>
<text x="64" y="132" font-size="28" font-weight="400" text-anchor="start" fill="#526277">先辨认责任范围，再决定哪些知识需要补上。</text>
<path d="M 64 158 L 1136 158" fill="none" stroke="#DEE4EC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="194" width="1072" height="466" rx="8" fill="#F0F5FC" stroke="#5A7FAD" stroke-width="2"/>
<text x="96" y="246" font-size="32" font-weight="600" text-anchor="start" fill="#2F5D92">借助 AI 能完成的范围</text>
<rect x="96" y="282" width="480" height="222" rx="8" fill="#EFF7F3" stroke="#5B927A" stroke-width="2"/>
<text x="128" y="333" font-size="32" font-weight="600" text-anchor="start" fill="#326A54">已有理解</text>
<text x="128" y="390" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">能够解释关键机制</text>
<text x="128" y="433" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">能够判断、修改和维护</text>
<text x="128" y="476" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">知道结论依赖哪些前提</text>
<rect x="608" y="282" width="496" height="222" rx="8" fill="#FFF5EA" stroke="#C99657" stroke-width="2"/>
<text x="640" y="333" font-size="32" font-weight="600" text-anchor="start" fill="#976020">理解债务</text>
<text x="640" y="390" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">影响当前的判断与维护</text>
<text x="640" y="433" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">需要自己负责</text>
<text x="640" y="476" font-size="28" font-weight="400" text-anchor="start" fill="#172B4D">但关键机制尚未弄懂</text>
<rect x="96" y="536" width="1008" height="90" rx="8" fill="#F5F7FA" stroke="#CAD3DF" stroke-width="2"/>
<text x="600" y="590" font-size="28" font-weight="400" text-anchor="middle" fill="#42546B">其余实现细节：通过稳定接口、成熟抽象和协作管理</text>
<text x="600" y="729" font-size="28" font-weight="400" text-anchor="middle" fill="#526277">不必填平所有差距，优先补上自己负责的关键保证。</text>
</g>
</svg>
