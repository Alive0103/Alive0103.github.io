<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">设计，也是在为错误保留退路</title>
  <desc id="desc">三类决定具有不同的纠错代价。调整局部函数，可以修改实现并核对行为；公开接口和历史数据含义，通常需要协调与迁移；删除唯一明细之后，即使回滚算法也无法重建已经丢失的事实。设计精力应关注不可逆决定，保留必要事实，但不要为了未知需求保存一切。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#1f2937">
    <text x="48" y="68" font-size="40" font-weight="600">设计，也是在为错误保留退路</text>
    <text x="48" y="114" font-size="26" fill="#64748b">按纠错代价分配设计精力，尤其留意信息丢失与长期依赖。</text>
    <path d="M 48 148 H 1152" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="48" y="178" width="1104" height="144" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="68" y="198" width="342" height="104" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="92" y="239" font-size="30" font-weight="600" fill="#2563eb">调整局部函数</text>
    <text x="92" y="278" font-size="26" fill="#64748b">修改仍在局部范围内</text>
    <path d="M 426 250 H 474" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="498" y="239" font-size="30" font-weight="600">可修改实现并核对行为</text>
    <text x="498" y="281" font-size="26" fill="#64748b">先采用直接实现，再根据反馈调整。</text>

    <rect x="48" y="344" width="1104" height="144" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="68" y="364" width="342" height="104" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="92" y="405" font-size="30" font-weight="600" fill="#047857">公开接口／数据含义</text>
    <text x="92" y="444" font-size="26" fill="#64748b">形成外部或历史依赖</text>
    <path d="M 426 416 H 474" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="498" y="405" font-size="30" font-weight="600">需要协调和迁移</text>
    <text x="498" y="447" font-size="26" fill="#64748b">明确约定，预留可执行的迁移路径。</text>

    <rect x="48" y="510" width="1104" height="144" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="68" y="530" width="342" height="104" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <text x="92" y="571" font-size="30" font-weight="600" fill="#b45309">删除唯一明细</text>
    <text x="92" y="610" font-size="26" fill="#64748b">原始事实已经丢失</text>
    <path d="M 426 582 H 474" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="498" y="571" font-size="30" font-weight="600">回滚算法无法重建事实</text>
    <text x="498" y="613" font-size="26" fill="#64748b">删除前，判断是否还需核对或重算历史。</text>

    <rect x="48" y="682" width="1104" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="76" y="721" font-size="30" font-weight="600">关注不可逆的决定，保留必要的事实</text>
    <text x="76" y="758" font-size="24" fill="#64748b">用已有证据判断什么值得保留；不因“未来可能用得上”而保存一切、抽象一切。</text>
  </g>
</svg>
