<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc"><title id="title">设计，也是在为错误保留退路</title><desc id="desc">三类决定具有不同的纠错代价。调整局部函数，可以修改实现并核对行为；公开接口和历史数据含义，通常需要协调与迁移；删除唯一明细之后，即使回滚算法也无法重建已经丢失的事实。设计精力应关注不可逆决定，保留必要事实，但不要为了未知需求保存一切。</desc><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1200" height="820" fill="#ffffff"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 600 410)"><path d="M0 0 L1200 0 L1200 820 L0 820" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M0 0 C387.75 0, 775.5 0, 1200 0 M0 0 C406.84 0, 813.67 0, 1200 0 M1200 0 C1200 219.92, 1200 439.84, 1200 820 M1200 0 C1200 282.03, 1200 564.06, 1200 820 M1200 820 C876.97 820, 553.93 820, 0 820 M1200 820 C779.52 820, 359.04 820, 0 820 M0 820 C0 574.79, 0 329.58, 0 0 M0 820 C0 504.18, 0 188.37, 0 0" stroke="transparent" stroke-width="2" fill="none"></path></g><g transform="translate(48 28) rotate(0 260 25)"><text x="0" y="35.80078125" font-family="Helvetica, Segoe UI Emoji" font-size="40px" fill="#1f2937" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">设计，也是在为错误保留退路</text></g><g transform="translate(48 88) rotate(0 338 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">按纠错代价分配设计精力，尤其留意信息丢失与长期依赖。</text></g><g stroke-linecap="round"><g transform="translate(48 148) rotate(0 552 0)"><path d="M0 0 C344.02 0, 688.04 0, 1104 0 M0 0 C244.74 0, 489.48 0, 1104 0" stroke="#cbd5e1" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(48 178) rotate(0 552 72)"><path d="M6 0 C252.08 0, 498.17 0, 1098 0 C1102 0, 1104 2, 1104 6 C1104 32.66, 1104 59.31, 1104 138 C1104 142, 1102 144, 1098 144 C676.44 144, 254.88 144, 6 144 C2 144, 0 142, 0 138 C0 86.05, 0 34.1, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M6 0 C307.34 0, 608.69 0, 1098 0 M6 0 C333.39 0, 660.79 0, 1098 0 M1098 0 C1102 0, 1104 2, 1104 6 M1098 0 C1102 0, 1104 2, 1104 6 M1104 6 C1104 43.1, 1104 80.2, 1104 138 M1104 6 C1104 37.22, 1104 68.43, 1104 138 M1104 138 C1104 142, 1102 144, 1098 1