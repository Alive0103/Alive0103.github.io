, 342 2, 342 6 C342 36, 342 66.01, 342 98 C342 102, 340 104, 336 104 C240.57 104, 145.15 104, 6 104 C2 104, 0 102, 0 98 C0 65.26, 0 32.53, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#ecfdf5"></path><path d="M6 0 C133.23 0, 260.46 0, 336 0 M6 0 C88.13 0, 170.26 0, 336 0 M336 0 C340 0, 342 2, 342 6 M336 0 C340 0, 342 2, 342 6 M342 6 C342 32.03, 342 58.05, 342 98 M342 6 C342 25.02, 342 44.04, 342 98 M342 98 C342 102, 340 104, 336 104 M342 98 C342 102, 340 104, 336 104 M336 104 C211.09 104, 86.18 104, 6 104 M336 104 C210.5 104, 85 104, 6 104 M6 104 C2 104, 0 102, 0 98 M6 104 C2 104, 0 102, 0 98 M0 98 C0 73.99, 0 49.99, 0 6 M0 98 C0 69.36, 0 40.72, 0 6 M0 6 C0 2, 2 0, 6 0 M0 6 C0 2, 2 0, 6 0" stroke="#047857" stroke-width="2" fill="none"></path></g><g transform="translate(92 375) rotate(0 135 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#047857" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">公开接口／数据含义</text></g><g transform="translate(92 418) rotate(0 117 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">形成外部或历史依赖</text></g><g stroke-linecap="round"><g transform="translate(426 416) rotate(0 24 0)"><path d="M0 0 C11.51 0, 23.02 0, 48 0 M0 0 C11.09 0, 22.17 0, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g><g transform="translate(426 416) rotate(0 24 0)"><path d="M25.45 8.21 C30.86 6.24, 36.26 4.27, 48 0 M25.45 8.21 C30.66 6.31, 35.86 4.42, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g><g transform="translate(426 416) rotate(0 24 0)"><path d="M25.45 -8.21 C30.86 -6.24, 36.26 -4.27, 48 0 M25.45 -8.21 C30.66 -6.31, 35.86 -4.42, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(498 375) rotate(0 105 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#1f2937" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">需要协调和迁移</text></g><g transform="translate(498 421) rotate(0 208 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">明确约定，预留可执行的迁移路径。</text></g><g stroke-linecap="round" transform="translate(48 510) rotate(0 552 72)"><path d="M6 0 C233.97 0, 461.93 0, 1098 0 C1102 0, 1104 2, 1104 6 C1104 54.88, 1104 103.75, 1104 138 C1104 142, 1102 144, 1098 144 C677.54 144, 257.08 144, 6 144 C2 144, 0 142, 0 138 C0 103.92, 0 69.84, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M6 0 C328.6 0, 651.2 0, 1098 0 M6 0 C397.25 0, 788.5 0, 1098 0 M1098 0 C1102 0, 1104 2, 1104 6 M1098 0 C1102 0, 1104 2, 1104 6 M1104 6 C1104 39.44, 1104 72.87, 1104 138 M1104 6 C1104 44.23, 1104 82.46, 1104 138 M1104 138 C1104 142, 1102 144, 1098 144 M1104 138 C1104 142, 1102 144, 1098 144 M1098 144 C842.65 144, 587.31 144, 6 144 M1098 144 C859.46 144, 620.92 144, 6 144 M6 144 C2 144, 0 142, 0 138 M6 144 C2 144, 0 142, 0 138 M0 138 C0 97.15, 0 56.3, 0 6 M0 138 C0 111.39, 0 84.77, 0 6 M0 6 C0 2, 2 0, 6 0 M0 6 C0 2, 2 0, 6 0" stroke="#cbd5e1" stroke-width="2" fill="none"></path></g><g stroke-linecap="round" transform="translate(68 530) rotate(0 171 52)"><path d="M6 0 C136.2 0, 266.41 0, 336 0 C340 0, 342 2, 342 6 C342 25.42, 342 44.84, 342 98 C342 102, 340 104, 336 104 C265.53 104, 195.06 104, 6 104 C2 104, 0 102, 0 98 C0 79.51, 0 61.02, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#fff7ed"></path><path d="M6 0 C93.94 0, 181.87 0, 336 0 M6 0 C93.61 0, 181.21 0, 336 0 M336 0 C340 0, 342 2, 342 6 M336 0 C340 0, 342 2, 342 6 M342 6 C342 25.77, 342 45.54, 342 98 M342 6 C342 35.9, 342 65.8, 342 98 M342 98 C342 102, 340 104, 336 104 M342 98 C342 102, 340 104, 336 104 M336 104 C260.13 104, 184.27 104, 6 104 M336 104 C251.61 104, 167.21 104, 6 104 M6 104 C2 104, 0 102, 0 98 M6 104 C2 104, 0 102, 0 98 M0 98 C0 71.12, 0 44.23, 0 6 M0 98 C0 76.54, 0 55.08, 0 6 M0 6 C0 2, 2 0, 6 0 M0 6 C0 2, 2 0, 6 0" stroke="#b45309" stroke-width="2" fill="none"></path></g><g transform="translate(92 541) rotate(0 90 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#b45309" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">删除唯一明细</text></g><g transform="translate(92 584) rotate(0 104 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">原始事实已经丢失</text></g><g stroke-linecap="round"><g transform="translate(426 582) rotate(0 24 0)"><path d="M0 0 C14.48 0, 28.96 0, 48 0 M0 0 C14.12 0, 28.25 0, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g><g transform="translate(426 582) rotate(0 24 0)"><path d="M25.45 8.21 C32.25 5.73, 39.05 3.26, 48 0 M25.45 8.21 C32.08 5.79, 38.72 3.38, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g><g transform="translate(426 582) rotate(0 24 0)"><path d="M25.45 -8.21 C32.25 -5.73, 39.05 -3.26, 48 0 M25.45 -8.21 C32.08 -5.79, 38.72 -3.38, 48 0" stroke="#64748b" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(498 541) rotate(0 150 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#1f2937" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">回滚算法无法重建事实</text></g><g transform="translate(498 587) rotate(0 234 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">删除前，判断是否还需核对或重算历史。</text></g><g stroke-linecap="round" transform="translate(48 682) rotate(0 552 48)"><path d="M6 0 C434.23 0, 862.45 0, 1098 0 C1102 0, 1104 2, 1104 6 C1104 36.57, 1104 67.15, 1104 90 C1104 94, 1102 96, 1098 96 C796.51 96, 495.02 96, 6 96 C2 96, 0 94, 0 90 C0 70.41, 0 50.81, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#f8fafc"></path><path d="M6 0 C332.8 0, 659.61 0, 1098 0 M6 0 C310.32 0, 614.64 0, 1098 0 M1098 0 C1102 0, 1104 2, 1104 6 M1098 0 C1102 0, 1104 2, 1104 6 M1104 6 C1104 30.9, 1104 55.8, 1104 90 M1104 6 C1104 27.04, 1104 48.07, 1104 90 M1104 90 C1104 94, 1102 96, 1098 96 M1104 90 C1104 94, 1102 96, 1098 96 M1098 96 C830.63 96, 563.26 96, 6 96 M1098 96 C796.5 96, 494.99 96, 6 96 M6 96 C2 96, 0 94, 0 90 M6 96 C2 96, 0 94, 0 90 M0 90 C0 62.28, 0 34.56, 0 6 M0 90 C0 67.76, 0 45.52, 0 6 M0 6 C0 2, 2 0, 6 0 M0 6 C0 2, 2 0, 6 0" stroke="#cbd5e1" stroke-width="2" fill="none"></path></g><g transform="translate(76 691) rotate(0 240 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#1f2937" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">关注不可逆的决定，保留必要的事实</text></g><g transform="translate(76 734) rotate(0 421.345 15)"><text x="0" y="21.48046875" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">用已有证据判断什么值得保留；不因“未来可能用得上”而保存一切、抽象一切。</text></g></svg>
