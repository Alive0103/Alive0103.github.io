<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc"><title id="title">相似的代码，会一起改变吗？</title><desc id="desc">退款期限与文件保留期限是独立政策。同一订单在同等相关条件下，用户与客服入口应共享退款期限判定依据，并保留政策适用条件。</desc><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1200" height="860" fill="#ffffff"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 600 430)"><path d="M0 0 L1200 0 L1200 860 L0 860" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M0 0 C331.72 0, 663.43 0, 1200 0 M0 0 C440.24 0, 880.48 0, 1200 0 M1200 0 C1200 261.16, 1200 522.32, 1200 860 M1200 0 C1200 311.55, 1200 623.1, 1200 860 M1200 860 C862.89 860, 525.77 860, 0 860 M1200 860 C842.48 860, 484.96 860, 0 860 M0 860 C0 661.06, 0 462.12, 0 0 M0 860 C0 674.57, 0 489.13, 0 0" stroke="transparent" stroke-width="2" fill="none"></path></g><g transform="translate(48 28) rotate(0 552 25)"><text x="0" y="35.80078125" font-family="Helvetica, Segoe UI Emoji" font-size="40px" fill="#1f2937" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">相似的代码，会一起改变吗？</text></g><g transform="translate(48 88) rotate(0 552 16.25)"><text x="0" y="23.2705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">用一次假设的需求变化，辨认真正需要共享的规则。</text></g><g stroke-linecap="round"><g transform="translate(48 148) rotate(0 552 0)"><path d="M0 0 C305.19 0, 610.39 0, 1104 0 M0 0 C422.66 0, 845.33 0, 1104 0" stroke="#cbd5e1" stroke-width="2" fill="none"></path></g></g><mask></mask><g stroke-linecap="round" transform="translate(48 172) rotate(0 552 150)"><path d="M6 0 C263.9 0, 521.79 0, 1098 0 C1102 0, 1104 2, 1104 6 C1104 85.59, 1104 165.18, 1104 294 C1104 298, 1102 300, 1098 300 C824.2 300, 550.4 300, 6 300 C2 300, 0 298, 0 294 C0 205.97, 0 117.94, 0 6 C0 2, 2 0, 6 0" stroke="none" stroke-width="0" fill="#fff7ed"></path><path d="M6 0 C307.88 0, 609.76 0, 1098 0 M6 0 C284.29 0, 562.57 0, 1098 0 M1098 0 C1102 0, 1104 2, 1104 6 M1098 0 C1102 0, 1104 2, 1104 6 M1104 6 C1104 71.3, 1104 136.59, 1104 294 M1104 6 C1104 69.98, 1104 133.95, 1104 294 M1104 294 C1104 298, 1102 300, 1098