<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">这次修改，改变了什么？</title>
<desc id="desc">结构重构把交织在同一个函数里的查询、组装和写入拆分成三个步骤，需要核对同样输入的可观察行为保持。行为调整以原来只接受Monday的接口为例：修改后也接受monday，可接受输入范围已经扩大，应核对变化是否符合需求。整理结构与调整规则应分别说明、分别核对。</desc>
