<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc"><title id="title">规则会变化，历史承诺仍然有效</title><desc id="desc">假设退款新政策只适用于新订单。政策切换点 T 之前下单的旧订单，即使在 T 之后申请退款，仍按下单日起三十天的申请窗口判定；T 之后下单的新订单按下单日起十四天的申请窗口判定。时间轴仅为示意，不按天数比例绘制。不能用今天的退款期限常量覆盖旧订单适用的约定。</desc><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
