<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">同一件事，三种不同的表示</title>
<desc id="desc">四条带证据的退款事件形成当前退款成功的状态视图，随后生成带证据引用的解释性摘要。申请、审核与提交都不等于退款成功。</desc>
<rect x="0" y="0" width="1200" height="940" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="50" y="48" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#315f9c">AGENT MEMORY  /  04</text>
<text x="50" y="108" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="600" fill="#172b45">同一件事，三种不同的表示</text>
<text x="50" y="149" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#52657a">事件保留过程，状态回答进度，摘要帮助快速理解。</text>
<rect x="50" y="210" width="340" height="470" rx="12" fill="#f1f5fb" stroke="#c8d3df" stroke-width="1.5"/>
<rect x="51" y="227" width="4" height="436" rx="0" fill="#315f9c" stroke="#315f9c" stroke-width="1.5"/>
<text x="74" y="260" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#315f9c">事件记录</text>
<text x="74" y="306" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">保留发生顺序与来源</text>
<rect x="70" y="330" width="300" height="66" rx="8" fill="#ffffff" stroke="#c8d3df" stroke-width="1.5"/>
<text x="86" y="358" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b45">10:00  申请创建</text>
<text x="86" y="383" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657a">工单事件</text>
<rect x="70" y="408" width="300" height="66" rx="8" fill="#ffffff" stroke="#c8d3df" stroke-width="1.5"/>
<text x="86" y="436" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b45">13:10  审核通过</text>
<text x="86" y="461" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657a">审核系统回执</text>
<rect x="70" y="486" width="300" height="66" rx="8" fill="#ffffff" stroke="#c8d3df" stroke-width="1.5"/>
<text x="86" y="514" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b45">14:20  退款已提交</text>
<text x="86" y="539" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657a">退款请求标识</text>
<rect x="70" y="564" width="300" height="66" rx="8" fill="#ffffff" stroke="#c8d3df" stroke-width="1.5"/>
<text x="86" y="592" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b45">15:05  退款成功</text>
<text x="86" y="617" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#52657a">支付成功回执</text>
<rect x="430" y="210" width="340" height="470" rx="12" fill="#eff7f4" stroke="#c8d3df" stroke-width="1.5"/>
<rect x="431" y="227" width="4" height="436" rx="0" fill="#247367" stroke="#247367" stroke-width="1.5"/>
<text x="454" y="260" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#247367">当前状态</text>
<text x="454" y="306" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">由明确事件推进</text>
<text x="455" y="383" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="600" fill="#247367">退款成功</text>
<text x="455" y="440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">对象：订单 O-1048</text>
<text x="455" y="482" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">依据：支付成功回执</text>
<text x="455" y="524" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">来源：event_payment_4</text>
<text x="455" y="566" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">版本：对应业务版本</text>
<rect x="454" y="600" width="292" height="52" rx="8" fill="#ffffff" stroke="#b4d1c7" stroke-width="1.5"/>
<text x="470" y="635" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#247367">摘要不能推进状态</text>
<rect x="810" y="210" width="340" height="470" rx="12" fill="#f5f2f9" stroke="#c8d3df" stroke-width="1.5"/>
<rect x="811" y="227" width="4" height="436" rx="0" fill="#6d5890" stroke="#6d5890" stroke-width="1.5"/>
<text x="834" y="260" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="600" fill="#6d5890">解释性摘要</text>
<text x="834" y="306" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#52657a">给人和模型快速阅读</text>
<text x="834" y="356" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b45">破损售后审核已通过。</text>
<text x="834" y="399" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b45">退款在提交后，</text>
<text x="834" y="442" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b45">已获支付成功回执。</text>
<text x="834" y="485" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b45">附：对应事件与凭证。</text>
<rect x="834" y="600" width="292" height="52" rx="8" fill="#ffffff" stroke="#ccc1dc" stroke-width="1.5"/>
<text x="850" y="634" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#6d5890">可压缩、可重新生成</text>
<polyline points="390,488 430,488" fill="none" stroke="#247367" stroke-width="2" stroke-linejoin="round"/>
<polyline points="419.00,483.00 430.00,488.00 419.00,493.00" fill="none" stroke="#247367" stroke-width="2" stroke-linejoin="round"/>
<polyline points="770,488 810,488" fill="none" stroke="#6d5890" stroke-width="2" stroke-linejoin="round"/>
<polyline points="799.00,483.00 810.00,488.00 799.00,493.00" fill="none" stroke="#6d5890" stroke-width="2" stroke-linejoin="round"/>
<rect x="50" y="730" width="1100" height="106" rx="12" fill="#fbf6ec" stroke="#d9c6a2" stroke-width="1.5"/>
<text x="74" y="778" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" fill="#9a6727">申请创建 ≠ 审核通过 ≠ 退款已提交 ≠ 退款成功</text>
<text x="74" y="821" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#9a6727">每一步都保留业务语义；自然语言承诺也不能替代执行回执。</text>
<polyline points="50,864 1150,864" fill="none" stroke="#c8d3df" stroke-width="2" stroke-linejoin="round"/>
<text x="50" y="906" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#52657a">图中时间与对象均为示例；交易结果以负责该状态的业务系统为准。</text>
</svg>
